[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "videolyzer"
version = "0.3.0"
description = "give agents the ability to understand and deep analyze videos"
readme = "README.md"
authors = [{name = "Neguiolidas"}]
license = {text = "Apache-2.0"}
requires-python = ">=3.10"
keywords = ["video", "video-analysis", "ai-agents", "multimodal", "gemini"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Multimedia :: Video",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "opencv-python>=4.8",
    "numpy>=1.24",
]

[project.optional-dependencies]
# Local transcription / audio measurements via the separate whispero package
# (0.8+: --provider local, --diarize JSON segments, `whispero hear`).
transcribe = ["whispero[local]>=0.8"]
hear = ["whispero[hear]>=0.8"]
dev = ["pytest>=7", "ruff>=0.5"]

[project.urls]
Homepage = "https://github.com/Neguiolidas/videolyzer"
Repository = "https://github.com/Neguiolidas/videolyzer"
Issues = "https://github.com/Neguiolidas/videolyzer/issues"

[project.scripts]
videolyzer = "videolyzer:main"

[tool.setuptools]
py-modules = ["videolyzer"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "B", "UP"]
# E501: long prompt strings / f-strings are intentional.
# B905: zip() strict= is noise for the paired-slice idioms used here.
ignore = ["E501", "B905"]
