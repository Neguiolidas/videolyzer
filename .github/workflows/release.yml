name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check tag matches version
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          VERSION=$(grep -m1 '^version' pyproject.toml | sed 's/.*"\(.*\)"/\1/')
          if [ "$TAG" != "$VERSION" ]; then
            echo "error: tag v$TAG does not match pyproject version $VERSION"
            exit 1
          fi
          echo "version OK: $VERSION"

      - name: Check __version__ matches pyproject
        run: |
          VERSION=$(grep -m1 '^version' pyproject.toml | sed 's/.*"\(.*\)"/\1/')
          MODVER=$(grep -m1 '^__version__' videolyzer.py | sed 's/.*"\(.*\)"/\1/')
          if [ "$VERSION" != "$MODVER" ]; then
            echo "error: videolyzer.__version__ $MODVER != pyproject $VERSION"
            exit 1
          fi

      - name: Run tests
        run: |
          sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg libgl1
          pip install -e ".[dev]"
          ruff check .
          python -m pytest -q

      - name: Build package
        run: |
          pip install build twine
          python -m build
          twine check dist/*

      - name: Upload dist artifact
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - name: Download dist artifact
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          skip-existing: true
